<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow - Smart Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="landing-page">
        <div class="ellipse ellipse1"></div>
        <div class="ellipse ellipse2"></div>
        
        <header class="header">
            <div class="logo">
                <img src="assets/eduflow-logo.png" alt="EduFlow Logo">
            </div>
            <div class="login-btn">
                <a href="/login">Login</a>
            </div>
        </header>
        
        <main class="main-content">
            <h1>Your Smart Workspace starts here</h1>
            <p>Organize courses, plan schedules, and manage payments all from one intuitive dashboard.</p>
            <div class="buttons">
                <button class="contact-us">Contact Us</button>
            </div>
        </main>
        
        <div class="dashboard-preview">
            <img src="assets/Dashboard.jpg" alt="Dashboard Preview">
        </div>
    </div>
</body>
</html>
